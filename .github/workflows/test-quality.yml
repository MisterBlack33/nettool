name: Test quality

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build application JAR
        run: mvn --batch-mode -DskipTests package
      - name: Build and smoke-test portable package
        shell: pwsh
        run: ./tools/scripts/Build-WindowsPackage.ps1
      - name: Archive portable package
        uses: actions/upload-artifact@v4
        with:
          name: nettool-windows-x64
          path: target/dist/nettool-*-windows-x64.zip
          if-no-files-found: error
  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile application and tests
        run: mvn --batch-mode -DskipTests package
      - name: Run platform-independent smoke tests
        run: >-
          mvn --batch-mode
          -Dtest=CliArgsTest,CliRunnerTest,CIDRUtilsBoundaryTest,CIDRUtilsExtTest,CIDRUtilsPropertyTest,Ipv6AddressUtilsTest,JsonCodecFuzzTest,HostSchemaVersionTest,HostSchemaMigrationV2Test,SafeCommandTest,IpValidatorTest,PlatformUtilsTest,PlatformSupportOsTest,PlatformSupportPropertyTest
          test
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run standard test suite
        if: github.event_name != 'schedule'
        shell: pwsh
        run: ./tools/scripts/Verify-TestSuite.ps1 -Runs 1
      - name: Repeat standard suite to detect flaky tests
        if: github.event_name == 'schedule'
        shell: pwsh
        run: ./tools/scripts/Verify-TestSuite.ps1 -Runs 5
      - name: Run complete suite including slow tests
        if: github.event_name == 'schedule'
        shell: pwsh
        run: ./tools/scripts/Verify-TestSuite.ps1 -IncludeSlow -SummaryName full
      - name: Archive Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            target/surefire-reports/
            tools/output/test-results/
          if-no-files-found: warn
